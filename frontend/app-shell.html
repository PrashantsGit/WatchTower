<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WatchTower</title>

    <link
        rel="stylesheet"
        href="css/design-system.css"
    >
    <link rel="stylesheet" href="css/app-shell.css">

</head>


<body>

    <!-- =====================================================
         APPLICATION SHELL
         ===================================================== -->

    <div class="app-shell">


        <!-- =================================================
             SIDEBAR
             ================================================= -->

        <aside class="sidebar">

            <!-- Brand -->

            <div class="sidebar-brand">

                <div class="brand-mark">
                    WT
                </div>

                <div class="brand-text">

                    <span class="brand-name">
                        WATCHTOWER
                    </span>

                    <span class="brand-tagline">
                        MONITOR • DETECT • NOTIFY
                    </span>

                </div>

            </div>


            <!-- Navigation -->

            <nav class="sidebar-navigation">


                <!-- Overview -->

                <div class="navigation-section">

                    <div class="navigation-label">
                        Overview
                    </div>

                    <a
                        href="#"
                        class="navigation-item active"
                    >
                        <span class="navigation-icon">
                            ◉
                        </span>

                        <span>
                            Dashboard
                        </span>
                    </a>

                </div>


                <!-- Monitoring -->

                <div class="navigation-section">

                    <div class="navigation-label">
                        Monitoring
                    </div>

                    <a
                        href="#"
                        class="navigation-item"
                    >
                        <span class="navigation-icon">
                            ◈
                        </span>

                        <span>
                            Tasks
                        </span>
                    </a>

                    <a
                        href="#"
                        class="navigation-item"
                    >
                        <span class="navigation-icon">
                            ◷
                        </span>

                        <span>
                            History
                        </span>
                    </a>

                </div>


                <!-- Alerts -->

                <div class="navigation-section">

                    <div class="navigation-label">
                        Alerts
                    </div>

                    <a
                        href="#"
                        class="navigation-item"
                    >
                        <span class="navigation-icon">
                            ◇
                        </span>

                        <span>
                            Notifications
                        </span>

                        <span class="notification-count">
                            3
                        </span>

                    </a>

                </div>


                <!-- System -->

                <div class="navigation-section">

                    <div class="navigation-label">
                        System
                    </div>

                    <a
                        href="#"
                        class="navigation-item"
                    >
                        <span class="navigation-icon">
                            ⚙
                        </span>

                        <span>
                            Settings
                        </span>

                    </a>

                </div>


            </nav>


            <!-- Sidebar footer -->

            <div class="sidebar-footer">

                <div class="engine-status">

                    <span class="status-indicator"></span>

                    <div>

                        <div class="engine-status-title">
                            Monitoring Engine
                        </div>

                        <div class="engine-status-value">
                            Operational
                        </div>

                    </div>

                </div>


                <div class="sidebar-user">

                    <div class="user-avatar">
                        PC
                    </div>

                    <div class="user-details">

                        <div class="user-name">
                            User
                        </div>

                        <div class="user-role">
                            Account
                        </div>

                    </div>

                </div>

            </div>

        </aside>



        <!-- =================================================
             MAIN APPLICATION AREA
             ================================================= -->

        <div class="app-main">


            <!-- =================================================
                 TOPBAR
                 ================================================= -->

            <header class="topbar">

                <div class="topbar-left">

                    <button
                        type="button"
                        class="mobile-menu-button"
                        aria-label="Open navigation"
                    >
                        ☰
                    </button>

                    <div class="page-heading">

                        <span class="page-title">
                            Dashboard
                        </span>

                        <span class="page-context">
                            Monitoring overview
                        </span>

                    </div>

                </div>


                <div class="topbar-right">

                    <button
                        type="button"
                        class="topbar-button"
                        aria-label="Search"
                    >
                        ⌕
                    </button>

                    <button
                        type="button"
                        class="topbar-button"
                        aria-label="Notifications"
                    >
                        ◇
                    </button>

                </div>

            </header>



            <!-- =================================================
                 PAGE CONTENT
                 ================================================= -->

            <main class="page-content">

                <div class="content-container">

                    <h1>
                        Dashboard
                    </h1>

                    <p>
                        Application shell preview.
                    </p>

                </div>

            </main>


        </div>


    </div>


</body>

</html>
