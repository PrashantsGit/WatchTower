<header class="topbar">

    <div class="topbar-left">

        <button
            type="button"
            id="mobile-menu-button"
            class="mobile-menu-button"
            aria-label="Open navigation"
            aria-expanded="false"
            title="Open navigation"
        >
            <span aria-hidden="true">☰</span>
        </button>

        <div class="page-heading">

            <span
                class="page-title"
                id="page-title"
            >
                Dashboard
            </span>

            <span
                class="page-context"
                id="page-context"
            >
                Monitoring overview
            </span>

        </div>

    </div>


    <div class="topbar-right">

        <button
            type="button"
            class="topbar-button"
            id="notifications-button"
            aria-label="Notifications"
            title="Notifications"
        >
            ◇
        </button>

        <button
            type="button"
            id="logout-button"
            class="topbar-button"
            aria-label="Logout"
            title="Logout"
        >
            ↪
        </button>

    </div>

</header>
