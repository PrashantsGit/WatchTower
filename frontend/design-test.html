<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WatchTower Design Test</title>

    <link rel="stylesheet" href="css/design-system.css">
</head>

<body>

    <div
        style="
            background: var(--wt-bg);
            color: var(--wt-text);
            padding: var(--wt-space-8);
            min-height: 100vh;
            font-family: var(--wt-font-sans);
        "
    >

        <h1>WatchTower</h1>

        <p style="color: var(--wt-text-secondary);">
            Design system test
        </p>

        <div
            style="
                background: var(--wt-surface);
                border: 1px solid var(--wt-border);
                border-radius: var(--wt-radius-lg);
                padding: var(--wt-space-6);
                box-shadow: var(--wt-shadow-md);
            "
        >

            <h2 style="color: var(--wt-gold);">
                Beacon Signal
            </h2>

            <p style="color: var(--wt-text-muted);">
                If you can see this on the dark background,
                our design tokens are loading correctly.
            </p>

        </div>

    </div>

</body>

</html>
