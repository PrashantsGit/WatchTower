<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Task — WatchTower</title>


    <!-- ========================================================
         WATCHTOWER STYLES
         ======================================================== -->

    <link
        rel="stylesheet"
        href="../css/design-system.css"
    >

    <link
        rel="stylesheet"
        href="../css/app-shell.css"
    >

    <link
        rel="stylesheet"
        href="../css/task.css"
    >

    <link
        rel="stylesheet"
        href="../css/create-task.css"
    >

</head>


<body data-page="tasks">

    <div class="app-shell">


        <!-- ====================================================
             SHARED SIDEBAR
             ==================================================== -->

        <aside
            id="app-sidebar"
            class="sidebar"
        ></aside>


        <!-- ====================================================
             MAIN APPLICATION AREA
             ==================================================== -->

        <main class="app-main">


            <!-- Shared Header -->

            <header
                id="app-header"
                class="topbar"
            ></header>


            <!-- =================================================
                 PAGE CONTENT
                 ================================================= -->

            <div class="page-content">

                <div class="content-container">


                    <!-- Page Intro -->

                    <div class="create-task-intro">

                        <div>

                            <h1>
                                Create Monitoring Task
                            </h1>

                            <p>
                                Tell WatchTower what you want to monitor.
                            </p>

                        </div>

                    </div>


                    <!-- =================================================
                         CREATE TASK PANEL
                         ================================================= -->

                    <section class="dashboard-panel create-task-panel">


                        <div class="panel-header">

                            <div>

                                <h2 class="panel-title">
                                    Task Configuration
                                </h2>

                                <p class="panel-description">
                                    Configure the target and how often WatchTower should check it.
                                </p>

                            </div>

                        </div>


                        <div class="create-task-body">


                            <form id="create-task-form">


                                <!-- Task Name -->

                                <div class="form-group">

                                    <label for="task-name">
                                        Task Name
                                    </label>

                                    <input
                                        type="text"
                                        id="task-name"
                                        name="name"
                                        placeholder="e.g. Monitor iPhone 15 Price"
                                        maxlength="150"
                                        required
                                    >

                                </div>


                                <!-- Description -->

                                <div class="form-group">

                                    <label for="task-description">
                                        Description
                                    </label>

                                    <textarea
                                        id="task-description"
                                        name="description"
                                        rows="4"
                                        placeholder="What are you monitoring?"
                                    ></textarea>

                                </div>


                                <!-- Target URL -->

                                <div class="form-group">

                                    <label for="target-url">
                                        Target URL
                                    </label>

                                    <input
                                        type="url"
                                        id="target-url"
                                        name="target_url"
                                        placeholder="https://example.com/product"
                                        required
                                    >

                                </div>


                                <!-- Check Interval -->

                                <div class="form-group">

                                    <label for="check-interval">
                                        Check Interval
                                    </label>

                                    <select
                                        id="check-interval"
                                        name="check_interval"
                                        required
                                    >

                                        <option value="30">
                                            30 minutes
                                        </option>

                                        <option
                                            value="60"
                                            selected
                                        >
                                            1 hour
                                        </option>

                                        <option value="120">
                                            2 hours
                                        </option>

                                        <option value="240">
                                            4 hours
                                        </option>

                                        <option value="720">
                                            12 hours
                                        </option>

                                        <option value="1440">
                                            24 hours
                                        </option>

                                    </select>

                                    <p class="form-hint">
                                        How often WatchTower should check the target.
                                    </p>

                                </div>


                                <!-- Form Message -->

                                <div
                                    id="form-message"
                                    class="form-message"
                                    aria-live="polite"
                                ></div>


                                <!-- Actions -->

                                <div class="form-actions">

                                    <button
                                        type="button"
                                        id="cancel-button"
                                        class="secondary-btn"
                                    >
                                        Cancel
                                    </button>


                                    <button
                                        type="submit"
                                        id="create-button"
                                        class="primary-btn"
                                    >
                                        Create Task
                                    </button>

                                </div>


                            </form>


                        </div>

                    </section>

                </div>

            </div>


            <!-- Shared Footer -->

            <footer
                id="app-footer"
                class="app-footer"
            ></footer>


        </main>

    </div>


    <!-- ========================================================
         SHARED COMPONENTS
         ======================================================== -->

    <script src="../js/components.js"></script>

    <!-- Page-specific logic -->

    <script src="../js/create-task.js"></script>

</body>

</html>
